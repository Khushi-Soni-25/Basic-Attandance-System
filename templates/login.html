<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Attendance</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="phone-app">
    <section class="page active-page">
      <div class="form-card">
        <h2>Login</h2>
        <p class="sub-text">Enter your attendance account</p>

        {% if error %}
          <div class="empty">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/login">
          <label>Username</label>
          <input type="text" name="username" required>

          <label>Password</label>
          <input type="password" name="password" required>

          <button class="save-btn" type="submit">Login</button>
        </form>

        <p class="sub-text">
          New here? <a href="/register">Create account</a>
        </p>
      </div>
    </section>
  </main>
</body>
</html>
